<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 4 | Your Details</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #0b0b0b;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #000;
      padding: 28px 24px;
      text-align: center;
    }

    header img {
      height: 56px;
    }

    .progress {
      width: 100%;
      height: 4px;
      background: #1f1f1f;
    }

    .bar {
      width: 80%;
      height: 100%;
      background: #38b6ff;
      transition: width 0.5s ease;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 70px 20px 80px;
      text-align: center;
      flex: 1;
    }

    h2 {
      font-size: 44px;
      margin-bottom: 10px;
      font-weight: 800;
      color: #fff;
    }

    .subtitle {
      font-size: 16px;
      color: #888;
      margin-bottom: 40px;
    }

    form {
      text-align: left;
    }

    .field {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #cfcfcf;
    }

    input,
    textarea {
      width: 100%;
      padding: 16px 18px;
      font-size: 17px;
      border-radius: 10px;
      border: 2px solid #1f1f1f;
      background: #111;
      color: #fff;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input::placeholder,
    textarea::placeholder {
      color: #555;
    }

    input:focus,
    textarea:focus {
      border-color: #38b6ff;
      box-shadow: 0 0 0 4px rgba(56, 182, 255, 0.15);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      width: 100%;
      background: #38b6ff;
      color: #000;
      border: none;
      padding: 18px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .step-label {
      margin-top: 40px;
      font-size: 13px;
      color: #555;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
    }

    @media (max-width: 768px) {
      h2 {
        font-size: 30px;
      }

      input,
      textarea {
        font-size: 16px;
        padding: 14px 16px;
      }
    }
  </style>
</head>

<body>

  <header>
    <img src="logo.png" alt="Mearns Detailers Logo">
  </header>

  <div class="progress">
    <div class="bar" id="progressBar"></div>
  </div>

  <div class="container">
    <h2>Your details</h2>
    <p class="subtitle">Final step — we reply fast.</p>

    <form id="detailForm" action="https://api.web3forms.com/submit" method="POST">

      <!-- Web3Forms Settings -->
      <input type="hidden" name="access_key" value="bd3527be-a2bd-4639-89e7-337b1f069923">
      <input type="hidden" name="subject" value="New Booking Request - Mearns Detailers">
      <input type="hidden" name="redirect" value="https://mearnsdetailers.com/thankyou.html">

      <input type="hidden" name="service" id="hiddenService">
      <input type="hidden" name="car" id="hiddenCar">

      <div class="field">
        <label>Name *</label>
        <input type="text" name="name" placeholder="Your full name" required>
      </div>

      <div class="field">
        <label>Phone number *</label>
        <input type="tel" name="number" placeholder="e.g. 07700 900000" required>
      </div>

      <div class="field">
        <label>Postcode *</label>
        <input type="text" name="postcode" placeholder="e.g. G77 5AA" required>
      </div>

      <div class="field">
        <label>Email address (optional)</label>
        <input type="email" name="email" placeholder="your@email.com">
      </div>

      <div class="field">
        <label>Additional message (optional)</label>
        <textarea name="message" placeholder="Any extra details, preferred dates, questions..."></textarea>
      </div>

      <button type="submit" id="submitBtn">Send Message</button>

    </form>

    <p class="step-label">Final step</p>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {

      var service = localStorage.getItem('service') || '';
      var vehicle = localStorage.getItem('vehicle') || '';

      document.getElementById('hiddenService').value = service;
      document.getElementById('hiddenCar').value = vehicle;

      const form = document.getElementById('detailForm');
      const submitBtn = document.getElementById('submitBtn');

      form.addEventListener('submit', function (e) {

        e.preventDefault();

        // Disable button to prevent double submissions
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending...';

        document.getElementById('progressBar').style.width = '100%';

        const formData = new FormData(form);

        // Abort controller for 4 second timeout on Google Sheets fetch
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 4000);

        fetch("https://script.google.com/macros/s/AKfycbyzb7rIkvgA9ZodOiwyh5bpNXYYKiqGvXTWHySJcX_y2lm2HV8FKaoNrBE984w0Ee6Q3g/exec", {
          method: "POST",
          body: formData,
          signal: controller.signal
        }).then(() => {
          clearTimeout(timeout);
          localStorage.clear();
          form.submit();
        }).catch(() => {
          clearTimeout(timeout);
          form.submit();
        });

      });

    });
  </script>

</body>

</html>
